[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2023-0071" },
    # chrono is unmaintained (RUSTSEC-2026-0543, published 2026-09-14; upstream
    # discussion chronotope/chrono#1768). An abandonment notice, not a
    # vulnerability: every version is affected, so there is no patched release.
    # It reaches this workspace through br-rust-common (br-core-events,
    # br-core-integration) and the dev-dependencies of conformance-identity and
    # conformance-scope. Retire this ignore when br-rust-common replaces chrono
    # (RustSec suggests jiff or time) or chrono is maintained again.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; no patched release; reached through br-rust-common" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/BotResources/br-rust-common",
  "https://github.com/BotResources/br-e2e-harness",
]
