name: cd

on:
  push:
    tags: ["oidc-test-idp/v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag of oidc-test-idp whose image to publish
        required: true
        type: string

concurrency:
  group: cd-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  publish-oidc-test-idp:
    name: publish oidc-test-idp image
    runs-on: ubuntu-latest
    env:
      CRATE: oidc-test-idp
      IMAGE: ghcr.io/botresources/br-oidc-test-idp
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: resolve version from the crate tag + gate
        id: ver
        run: |
          set -euo pipefail
          version="$(bash .github/scripts/artifact-tag.sh "${CRATE}" "${RELEASE_TAG}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if docker manifest inspect "${IMAGE}:${version}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${IMAGE}:${version} already exists — nothing to publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: setup rust targets
        if: steps.ver.outputs.skip == 'false'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: setup zig
        if: steps.ver.outputs.skip == 'false'
        uses: mlugg/setup-zig@53fc45b17fe98b52f92ee5ea08ff48a85a3e7eb7 # v1.2.2
        with:
          version: 0.13.0

      - name: install cargo-zigbuild
        if: steps.ver.outputs.skip == 'false'
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-zigbuild

      - name: cargo cache
        if: steps.ver.outputs.skip == 'false'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: setup buildx
        if: steps.ver.outputs.skip == 'false'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: cargo zigbuild (x86_64-musl)
        if: steps.ver.outputs.skip == 'false'
        run: cargo zigbuild --release --locked -p "${CRATE}" --target x86_64-unknown-linux-musl

      - name: cargo zigbuild (aarch64-musl)
        if: steps.ver.outputs.skip == 'false'
        run: cargo zigbuild --release --locked -p "${CRATE}" --target aarch64-unknown-linux-musl

      - name: assert static (no PT_INTERP)
        if: steps.ver.outputs.skip == 'false'
        run: |
          set -euo pipefail
          for triple in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            path="target/${triple}/release/${CRATE}"
            if readelf -l "$path" | grep -q "INTERP"; then
              echo "::error::$path has a PT_INTERP segment — it is NOT static"
              readelf -l "$path" | grep -A2 "INTERP"
              exit 1
            fi
            echo "ok: $path is static"
          done

      - name: docker build + push (amd64)
        if: steps.ver.outputs.skip == 'false'
        run: |
          ARCH_TAG="${IMAGE}:${{ steps.ver.outputs.version }}-${COMMIT:0:12}-amd64"
          docker build --provenance=false --platform linux/amd64 \
            --build-arg "BIN_PATH=target/x86_64-unknown-linux-musl/release/${CRATE}" \
            --file "crates/${CRATE}/Dockerfile" \
            --tag "${ARCH_TAG}" .
          docker push "${ARCH_TAG}"
        env:
          COMMIT: ${{ steps.ver.outputs.commit }}

      - name: docker build + push (arm64)
        if: steps.ver.outputs.skip == 'false'
        run: |
          ARCH_TAG="${IMAGE}:${{ steps.ver.outputs.version }}-${COMMIT:0:12}-arm64"
          docker build --provenance=false --platform linux/arm64 \
            --build-arg "BIN_PATH=target/aarch64-unknown-linux-musl/release/${CRATE}" \
            --file "crates/${CRATE}/Dockerfile" \
            --tag "${ARCH_TAG}" .
          docker push "${ARCH_TAG}"
        env:
          COMMIT: ${{ steps.ver.outputs.commit }}

      - name: create + push multi-arch manifest
        if: steps.ver.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          docker manifest create "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-${COMMIT:0:12}-amd64" \
            "${IMAGE}:${VERSION}-${COMMIT:0:12}-arm64"
          docker manifest push "${IMAGE}:${VERSION}"
        env:
          COMMIT: ${{ steps.ver.outputs.commit }}
