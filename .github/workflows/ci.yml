name: ci

on:
  pull_request:
  push:
    branches: [main, "release/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy-test:
    name: cargo fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-targets --locked
      - name: spawned-nats slice stays free of br-rust-common
        run: |
          set -euo pipefail
          cargo check -p br-test-harness --no-default-features --features spawned-nats --locked
          tree=$(cargo tree -p br-test-harness --no-default-features --features spawned-nats -e normal)
          if printf '%s\n' "$tree" | grep -q 'br-rust-common'; then
            printf '%s\n' "$tree" | grep 'br-rust-common'
            echo "::error::the spawned-nats slice pulls br-rust-common; br-rust-common can no longer dev-depend on SpawnedNats without a cycle" >&2
            exit 1
          fi
          echo "✓ spawned-nats is fabric-free"

  infra-e2e:
    name: harness self-test (real infra)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      E2E_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: infra-e2e
      - name: install nats-server
        env:
          NATS_SERVER_VERSION: v2.14.1
        run: |
          set -euo pipefail
          url="https://github.com/nats-io/nats-server/releases/download/${NATS_SERVER_VERSION}/nats-server-${NATS_SERVER_VERSION}-linux-amd64.tar.gz"
          curl -fsSL "$url" -o /tmp/nats-server.tar.gz
          tar -xzf /tmp/nats-server.tar.gz -C /tmp
          sudo install "/tmp/nats-server-${NATS_SERVER_VERSION}-linux-amd64/nats-server" /usr/local/bin/nats-server
          nats-server --version
      - name: harness real-infra self-tests
        run: cargo test -p br-test-harness --all-targets --locked -- --ignored
      - name: scope-declaration conformance battery
        run: cargo test -p conformance-scope --test conformance --locked -- --ignored
      - name: scope-declaration conformance battery via the CLI binary
        run: cargo test -p conformance-scope-cli --test spawn_cli --locked -- --ignored
      - name: scope-acceptance conformance battery
        run: cargo test -p conformance-identity --test conformance --locked -- --ignored
      - name: nats-fabric conformance battery
        run: cargo test -p conformance-nats-fabric --test conformance --locked -- --ignored
      - name: no Go subject is built inside the passport conformance crates
        run: |
          set -euo pipefail
          bash .github/scripts/test-go-free-gate.sh
          bash .github/scripts/go-free-gate.sh
      - name: identity-passport anchor checks (freezes the committed wire vectors) and build onto PATH
        run: |
          set -euo pipefail
          make -C conformance-subjects/identity-passport guard
          go -C conformance-subjects/identity-passport vet ./...
          go -C conformance-subjects/identity-passport test -count=1 ./...
          mkdir -p "$RUNNER_TEMP/passport-bin"
          CGO_ENABLED=0 go build -C conformance-subjects/identity-passport -o "$RUNNER_TEMP/passport-bin/identity-passport" .
          echo "$RUNNER_TEMP/passport-bin" >> "$GITHUB_PATH"
      - name: passport conformance battery
        run: cargo test -p conformance-passport --all-targets --locked -- --ignored --test-threads=1
      - name: passport conformance battery via the CLI binary
        run: cargo test -p conformance-passport-cli --test cli --locked -- --ignored --test-threads=1
      - name: directory conformance battery
        run: cargo test -p conformance-directory --test conformance --locked -- --ignored --test-threads=1

  msrv:
    name: MSRV 1.88 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: msrv
      - run: cargo build --workspace --locked

  docs:
    name: cargo doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: docs
      - run: cargo doc --workspace --no-deps --locked

  deny:
    name: cargo-deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check advisories bans licenses sources

  unused-deps:
    name: cargo-machete (unused deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-machete
      - run: cargo machete

  semver:
    name: cargo semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: semver
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-semver-checks@0.51.0
      - name: cargo semver-checks against each crate's previous tag
        run: |
          set -euo pipefail
          source .github/scripts/tracked-libraries.sh
          for crate in $TRACKED_LIBRARIES; do
            case " $SEMVER_GATED_LIBRARIES " in
              *" $crate "*) bash .github/scripts/semver-check.sh "$crate" ;;
              *) echo "::notice::$crate is a conformance battery (executable spec); its assert-helper API tracks the lib contract and renames with it, so it is exempt from semver-checks" ;;
            esac
          done

  changelog:
    name: changelog entry per Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: check changelog entries
        run: |
          set -euo pipefail
          source .github/scripts/tracked-libraries.sh
          for crate in $TRACKED_LIBRARIES; do
            bash .github/scripts/check-changelog.sh "$crate"
          done
      - name: check companion crates follow their library
        run: bash .github/scripts/check-companions.sh
      - name: check README tag pins are fresh
        run: |
          set -euo pipefail
          source .github/scripts/tracked-libraries.sh
          for crate in $TRACKED_LIBRARIES; do
            bash .github/scripts/check-readme-pins.sh "$crate"
          done

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: shellcheck .github/scripts
        run: |
          set -euo pipefail
          shellcheck --version
          shellcheck -x --severity=warning .github/scripts/*.sh

  release-tooling:
    name: release-line law and registry wiring tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: release-line decision table
        run: bash .github/scripts/test-release-line.sh
      - name: README pin gate
        run: bash .github/scripts/test-readme-pins.sh
      - name: release detection, companions and artifact dispatch
        run: bash .github/scripts/test-release-pipeline.sh
      - name: registry gate, tag and record wiring
        run: bash .github/scripts/test-registry-wiring.sh

  registry-gate:
    name: registry gate
    if: github.event_name == 'pull_request' && (github.base_ref == 'main' || startsWith(github.base_ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: release-line law and registry gate for every bumped tracked crate
        env:
          BASE_REF: ${{ github.base_ref }}
          BR_REGISTRY_KEY: ${{ secrets.BR_REGISTRY_KEY }}
        run: bash .github/scripts/pr-registry-gate.sh

  trufflehog:
    name: trufflehog (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51 # v3.95.5
        with:
          extra_args: --results=verified,unknown
