name: release-cli

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CRATE: conformance-scope-cli
  BIN: conformance-scope

jobs:
  gate:
    name: resolve version + gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@v5

      - name: resolve version + gate on existing assets
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')"
          if [ -z "$version" ]; then
            echo "::error file=Cargo.toml::could not extract the workspace version"
            exit 1
          fi
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          marker="${BIN}-${version}-x86_64-unknown-linux-musl.tar.gz"
          if gh release view "${tag}" --json assets \
               --jq '.assets[].name' 2>/dev/null | grep -qx "${marker}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} already carries ${marker} — nothing to build"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build ${{ matrix.target }}
    needs: gate
    if: needs.gate.outputs.skip == 'false'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            builder: zigbuild
          - target: aarch64-apple-darwin
            runner: macos-14
            builder: native
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: setup rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: setup zig
        if: matrix.builder == 'zigbuild'
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: install cargo-zigbuild
        if: matrix.builder == 'zigbuild'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: cargo cache
        uses: Swatinem/rust-cache@v2

      - name: build (zigbuild)
        if: matrix.builder == 'zigbuild'
        run: cargo zigbuild --release --locked -p "${CRATE}" --target ${{ matrix.target }}

      - name: build (native)
        if: matrix.builder == 'native'
        run: cargo build --release --locked -p "${CRATE}" --target ${{ matrix.target }}

      - name: assert static (no PT_INTERP)
        if: matrix.builder == 'zigbuild'
        run: |
          set -euo pipefail
          path="target/${{ matrix.target }}/release/${BIN}"
          if readelf -l "$path" | grep -q "INTERP"; then
            echo "::error::$path has a PT_INTERP segment — it is NOT static"
            readelf -l "$path" | grep -A2 "INTERP"
            exit 1
          fi
          echo "ok: $path is static"

      - name: package
        id: pkg
        run: |
          set -euo pipefail
          version="${{ needs.gate.outputs.version }}"
          target="${{ matrix.target }}"
          asset="${BIN}-${version}-${target}.tar.gz"
          src="target/${target}/release/${BIN}"
          chmod +x "$src"
          tar -C "target/${target}/release" -czf "$asset" "${BIN}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "${asset}.sha256"
          else
            shasum -a 256 "$asset" > "${asset}.sha256"
          fi
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}-${{ matrix.target }}
          path: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish to the unified release
    needs: [gate, build]
    if: needs.gate.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: ensure tag + release, then upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.gate.outputs.version }}"
          tag="${{ needs.gate.outputs.tag }}"

          if ! git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" -m "br-e2e-harness ${version}"
            git push origin "${tag}"
          fi

          if ! gh release view "${tag}" >/dev/null 2>&1; then
            notes_file="$(mktemp)"
            awk -v target="## [${version}]" '
              index($0, target) == 1 { in_section = 1; print; next }
              in_section && index($0, "## [") == 1 { exit }
              in_section { print }
            ' CHANGELOG.md > "$notes_file"
            if [ ! -s "$notes_file" ]; then
              printf 'See [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md) for changes.\n' \
                "$GITHUB_REPOSITORY" "$tag" > "$notes_file"
            fi
            gh release create "${tag}" --title "br-e2e-harness ${version}" --notes-file "$notes_file" --verify-tag
            rm -f "$notes_file"
          fi

          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.sha256)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::no built assets found under dist/"
            exit 1
          fi
          gh release upload "${tag}" "${assets[@]}" --clobber
