name: release-cli

on:
  push:
    tags: ['conformance-scope-cli-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. conformance-scope-cli-v0.1.0). Created if missing.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CRATE: conformance-scope-cli
  BIN: conformance-scope

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            builder: zigbuild
          - target: aarch64-apple-darwin
            runner: macos-14
            builder: native
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: resolve version
        id: ver
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = ' "crates/${CRATE}/Cargo.toml" | sed -E 's/^version = "([^"]+)".*/\1/')"
          if [ -z "$version" ]; then
            echo "::error::could not extract version from crates/${CRATE}/Cargo.toml"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: setup rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: setup zig
        if: matrix.builder == 'zigbuild'
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: install cargo-zigbuild
        if: matrix.builder == 'zigbuild'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: cargo cache
        uses: Swatinem/rust-cache@v2

      - name: build (zigbuild)
        if: matrix.builder == 'zigbuild'
        run: cargo zigbuild --release --locked -p "${CRATE}" --target ${{ matrix.target }}

      - name: build (native)
        if: matrix.builder == 'native'
        run: cargo build --release --locked -p "${CRATE}" --target ${{ matrix.target }}

      - name: assert static (no PT_INTERP)
        if: matrix.builder == 'zigbuild'
        run: |
          set -euo pipefail
          path="target/${{ matrix.target }}/release/${BIN}"
          if readelf -l "$path" | grep -q "INTERP"; then
            echo "::error::$path has a PT_INTERP segment — it is NOT static"
            readelf -l "$path" | grep -A2 "INTERP"
            exit 1
          fi
          echo "ok: $path is static"

      - name: package
        id: pkg
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          target="${{ matrix.target }}"
          asset="${BIN}-${version}-${target}.tar.gz"
          src="target/${target}/release/${BIN}"
          chmod +x "$src"
          tar -C "target/${target}/release" -czf "$asset" "${BIN}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "${asset}.sha256"
          else
            shasum -a 256 "$asset" > "${asset}.sha256"
          fi
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}-${{ matrix.target }}
          path: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: resolve tag + version
        id: rel
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="${GITHUB_REF_NAME}"
          fi
          version="$(grep -m1 '^version = ' "crates/${CRATE}/Cargo.toml" | sed -E 's/^version = "([^"]+)".*/\1/')"
          expected="${CRATE}-v${version}"
          if [ "$tag" != "$expected" ]; then
            echo "::error::tag ${tag} does not match ${CRATE} version ${version} (expected ${expected})"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: create-or-update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.rel.outputs.tag }}"
          version="${{ steps.rel.outputs.version }}"
          changelog="crates/${CRATE}/CHANGELOG.md"

          if ! git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" -m "${CRATE} ${version}"
            git push origin "${tag}"
          fi

          notes_file="$(mktemp)"
          awk -v target="## [${version}]" '
            index($0, target) == 1 { in_section = 1; print; next }
            in_section && index($0, "## [") == 1 { exit }
            in_section { print }
          ' "$changelog" > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            echo "::warning file=${changelog}::could not extract notes for ${tag}; using placeholder"
            printf 'See [%s](https://github.com/%s/blob/%s/%s) for changes.\n' \
              "$changelog" "$GITHUB_REPOSITORY" "$tag" "$changelog" > "$notes_file"
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" --title "${CRATE} ${version}" --notes-file "$notes_file"
          else
            gh release create "${tag}" --title "${CRATE} ${version}" --notes-file "$notes_file" --verify-tag
          fi
          rm -f "$notes_file"

          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.sha256)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::no built assets found under dist/"
            exit 1
          fi
          gh release upload "${tag}" "${assets[@]}" --clobber
