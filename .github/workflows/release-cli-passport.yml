name: release-cli-passport

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag of conformance-passport whose CLI binaries to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-cli-passport-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CRATE: conformance-passport-cli
  LIBRARY: conformance-passport
  BIN: conformance-passport
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  gate:
    name: resolve version from the library tag + gate
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: resolve version + gate on existing assets
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(bash .github/scripts/artifact-tag.sh "${LIBRARY}" "${RELEASE_TAG}")"
          bash .github/scripts/check-companions.sh "refs/tags/${RELEASE_TAG}" "${LIBRARY}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          marker="${BIN}-${version}-x86_64-unknown-linux-musl.tar.gz"
          if gh release view "${RELEASE_TAG}" --json assets \
               --jq '.assets[].name' 2>/dev/null | grep -qx "${marker}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${RELEASE_TAG} already carries ${marker} — nothing to build"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build ${{ matrix.target }}
    needs: gate
    if: needs.gate.outputs.skip == 'false'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            builder: zigbuild
          - target: aarch64-apple-darwin
            runner: macos-14
            builder: native
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: setup rust target
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: setup zig
        if: matrix.builder == 'zigbuild'
        uses: mlugg/setup-zig@53fc45b17fe98b52f92ee5ea08ff48a85a3e7eb7 # v1.2.2
        with:
          version: 0.13.0

      - name: install cargo-zigbuild
        if: matrix.builder == 'zigbuild'
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-zigbuild

      - name: cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: build (zigbuild)
        if: matrix.builder == 'zigbuild'
        run: cargo zigbuild --release --locked -p "${CRATE}" --target ${{ matrix.target }}

      - name: build (native)
        if: matrix.builder == 'native'
        run: cargo build --release --locked -p "${CRATE}" --target ${{ matrix.target }}

      - name: assert static (no PT_INTERP)
        if: matrix.builder == 'zigbuild'
        run: |
          set -euo pipefail
          path="target/${{ matrix.target }}/release/${BIN}"
          if readelf -l "$path" | grep -q "INTERP"; then
            echo "::error::$path has a PT_INTERP segment — it is NOT static"
            readelf -l "$path" | grep -A2 "INTERP"
            exit 1
          fi
          echo "ok: $path is static"

      - name: package
        id: pkg
        run: |
          set -euo pipefail
          version="${{ needs.gate.outputs.version }}"
          target="${{ matrix.target }}"
          asset="${BIN}-${version}-${target}.tar.gz"
          src="target/${target}/release/${BIN}"
          chmod +x "$src"
          tar -C "target/${target}/release" -czf "$asset" "${BIN}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "${asset}.sha256"
          else
            shasum -a 256 "$asset" > "${asset}.sha256"
          fi
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - name: upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.BIN }}-${{ matrix.target }}
          path: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: attach the binaries to the library release
    needs: [gate, build]
    if: needs.gate.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: upload assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.sha256)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::no built assets found under dist/"
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
