[package]
name = "conformance-scope-cli"
version = "0.1.0"
description = "Language-agnostic CLI for the BotResources scope-declaration conformance battery"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "conformance-scope"
path = "src/main.rs"

[dependencies]
conformance-scope = { path = "../conformance-scope", version = "0.2.0" }

tokio = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = "0.10"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
assert_cmd = "2"
