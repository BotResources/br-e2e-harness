[package]
name = "conformance-passport"
version.workspace = true
description = "Black-box conformance runner for the BotResources bearer/PAT -> Passport resolution endpoint — TEST FIXTURE ONLY"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
br-core-auth = { git = "https://github.com/BotResources/br-rust-common", package = "br-core-auth", tag = "v1.2.0", version = "1.2.0", features = [
    "test-support",
] }
br-core-kernel = { git = "https://github.com/BotResources/br-rust-common", package = "br-core-kernel", tag = "v1.2.0", version = "1.2.0" }
br-auth-contract = { git = "https://github.com/BotResources/svc-auth", package = "br-auth-contract", tag = "v1.0.4", version = "0.2.0" }
br-auth-identity-util = { git = "https://github.com/BotResources/svc-auth", package = "br-auth-identity-util", tag = "v1.0.4", version = "0.2.0" }
br-util-nats-fabric = { git = "https://github.com/BotResources/br-rust-common", package = "br-util-nats-fabric", tag = "v1.2.0", version = "1.2.0" }

br-test-harness = { path = "../br-test-harness", version = "1.0.0", default-features = false, features = [
    "nats-fabric",
] }

tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
uuid = { version = "1", features = ["v7"] }
thiserror = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
