[package]
name = "br-test-harness"
version.workspace = true
description = "Real-infra end-to-end test harness for BotResources platform services — TEST FIXTURE ONLY"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
ignored = ["serde"]

[[bin]]
name = "fabric-nats"
path = "src/bin/fabric_nats.rs"
required-features = ["nats-fabric"]

[features]
default = ["full"]
full = ["nats", "spawned-nats", "nats-fabric", "e2e-db", "server", "passport", "graphql", "sse", "ws", "oidc"]

nats = ["dep:async-nats", "dep:dotenvy", "dep:url", "dep:percent-encoding", "dep:futures-util"]
spawned-nats = ["dep:tempfile"]
nats-fabric = ["nats", "spawned-nats", "passport", "dep:br-util-nats-fabric", "dep:br-core-integration", "dep:br-core-directory", "dep:br-scope-declaration-contract", "dep:clap", "dep:toml", "dep:thiserror"]
e2e-db = ["dep:sqlx", "dep:dotenvy"]
server = ["dep:axum", "http-client"]
passport = ["dep:br-core-auth"]
graphql = ["passport", "http-client"]
sse = ["passport", "http-client", "dep:bytes", "dep:futures-util"]
ws = ["passport", "dep:tokio-tungstenite", "dep:futures-util"]
oidc = ["dep:oidc-test-idp"]

http-client = ["dep:reqwest"]

[dependencies]
br-core-auth = { git = "https://github.com/BotResources/br-rust-common", package = "br-core-auth", tag = "v1.2.0", version = "1.2.0", features = ["test-support"], optional = true }
br-util-nats-fabric = { git = "https://github.com/BotResources/br-rust-common", package = "br-util-nats-fabric", tag = "v1.2.0", version = "1.2.0", optional = true }
br-core-integration = { git = "https://github.com/BotResources/br-rust-common", package = "br-core-integration", tag = "v1.2.0", version = "1.2.0", optional = true }
br-core-directory = { git = "https://github.com/BotResources/br-rust-common", package = "br-core-directory", tag = "v1.2.0", version = "1.2.0", optional = true }
br-scope-declaration-contract = { git = "https://github.com/BotResources/br-rust-common", package = "br-scope-declaration-contract", tag = "v1.2.0", version = "1.2.0", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
toml = { version = "0.8", optional = true }
thiserror = { workspace = true, optional = true }

oidc-test-idp = { path = "../oidc-test-idp", version = "1.0.0", optional = true }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-nats = { version = "0.48", optional = true }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
], optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
], optional = true }
axum = { workspace = true, optional = true }
uuid = { version = "1", features = ["v7"] }
dotenvy = { version = "0.15", optional = true }
url = { version = "2", optional = true }
percent-encoding = { version = "2", optional = true }
futures-util = { version = "0.3", optional = true }
tokio-tungstenite = { version = "0.28", default-features = false, features = [
    "connect",
    "rustls-tls-native-roots",
], optional = true }
bytes = { version = "1", optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
br-util-nats-fabric = { git = "https://github.com/BotResources/br-rust-common", package = "br-util-nats-fabric", tag = "v1.2.0", version = "1.2.0" }
br-scope-declaration-contract = { git = "https://github.com/BotResources/br-rust-common", package = "br-scope-declaration-contract", tag = "v1.2.0", version = "1.2.0" }
