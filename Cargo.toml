[workspace]
resolver = "3"
members = [
    "crates/br-test-harness",
    "crates/conformance-directory",
    "crates/conformance-identity",
    "crates/conformance-nats-fabric",
    "crates/conformance-passport",
    "crates/conformance-scope",
    "crates/conformance-scope-cli",
    "crates/oidc-test-idp",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/BotResources/br-e2e-harness"

[workspace.dependencies]
axum = "0.8"
base64 = "0.22"
jsonwebtoken = "9"
rand = "0.8"
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[patch."https://github.com/BotResources/br-e2e-harness"]
oidc-test-idp = { path = "crates/oidc-test-idp" }
br-test-harness = { path = "crates/br-test-harness" }
conformance-directory = { path = "crates/conformance-directory" }
conformance-identity = { path = "crates/conformance-identity" }
conformance-nats-fabric = { path = "crates/conformance-nats-fabric" }
conformance-passport = { path = "crates/conformance-passport" }
conformance-scope = { path = "crates/conformance-scope" }

[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3
